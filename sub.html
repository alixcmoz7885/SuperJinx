:root{--bg:#06070d;--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.11);--line:rgba(255,255,255,.12);--text:#f4f6fb;--muted:rgba(244,246,251,.66);--blue:#20a4ff;--violet:#7c4dff;--green:#37e66f;--amber:#ffb020;--red:#ff5a52;--r:24px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;padding:max(20px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 80% at 80% -10%,#122a6b 0,transparent 60%),radial-gradient(90% 70% at -10% 90%,#3b1773 0,transparent 60%),var(--bg)}
.sky i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;animation:drift 22s ease-in-out infinite alternate}
.sky i:nth-child(1){width:70vmin;height:70vmin;right:-20%;top:-15%;background:#1d4ed8}
.sky i:nth-child(2){width:60vmin;height:60vmin;left:-25%;bottom:5%;background:#6d28d9;animation-delay:-9s}
@keyframes drift{to{transform:translate(4%,6%) scale(1.08)}}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);box-shadow:0 18px 44px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18)}
.brand{display:flex;align-items:center;gap:12px;padding:14px 16px;text-decoration:none;color:inherit}
.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:900;letter-spacing:-.04em;background:linear-gradient(135deg,var(--blue),var(--violet));box-shadow:0 8px 24px rgba(32,164,255,.35)}
.brand b{display:block;font-size:16px}.brand small{color:var(--muted);font-size:13px}

.hero{padding:20px}
.who{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}

.pill{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;white-space:nowrap}

.ring circle{fill:none;stroke-width:11;stroke-linecap:round}

.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:800}
.big small{color:var(--muted);font-size:13px}.big strong{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;margin:2px 0}
.big em{font-style:normal;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}

.hidden{display:none!important}
.sec{padding:6px 0}
.sec h2{margin:12px 18px 8px;font-size:15px;color:var(--muted);font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid rgba(255,255,255,.07)}
.row:first-of-type{border-top:0}
.ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;font-size:18px;background:var(--glass2)}
.body{flex:1;min-width:0}
.body b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body small{display:block;font-size:12px;color:var(--muted);direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;background:rgba(32,164,255,.18);color:#bfe6ff;margin-inline-start:6px;vertical-align:middle}
.btn{width:42px;height:42px;border-radius:13px;border:1px solid rgba(255,255,255,.1);background:var(--glass2);color:var(--text);display:grid;place-items:center;cursor:pointer;flex-shrink:0;transition:transform .12s,background .15s}
.btn:active{transform:scale(.92)}.btn svg{width:19px;height:19px}
.btn.done{background:rgba(55,230,111,.2);color:var(--green);border-color:rgba(55,230,111,.4)}
.wide{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 32px);margin:6px 16px 14px;height:48px;border-radius:999px;border:0;font:inherit;font-size:15px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--blue),#4f7bff);box-shadow:0 10px 26px rgba(32,164,255,.35);cursor:pointer}
.wide:active{transform:scale(.98)}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 16px 16px}
.app{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:inherit;text-decoration:none;font-weight:700;font-size:14px}
.app i{font-style:normal;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#1e3a8a,#6d28d9);font-size:15px}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:6px}
.foot a{color:#bfe6ff;text-decoration:none}

.modal.show{display:flex}
.sheet{width:100%;max-width:380px;padding:18px;text-align:center}
.sheet h3{margin:4px 0 14px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.acts{display:flex;gap:8px;margin-top:14px}

.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.sky i{animation:none}.ring .v{transition:none}}

    }
    function penalty() {
      var res = 0, dark = 0;
      function runs(get) {
        for (var a = 0; a < size; a++) {
          var color = false, run = 0, hist = [0,0,0,0,0,0,0];
          function push(r) { if (hist[0] == 0) r += size; hist.pop(); hist.unshift(r); }
          function count() { var n = hist[1], core = n > 0 && hist[2] == n && hist[3] == n * 3 && hist[4] == n && hist[5] == n;
            return (core && hist[0] >= n * 4 && hist[6] >= n ? 1 : 0) + (core && hist[6] >= n * 4 && hist[0] >= n ? 1 : 0); }
          for (var b = 0; b < size; b++) {
            if (get(a, b) == color) { run++; if (run == 5) res += 3; else if (run > 5) res++; }
            else { push(run); if (!color) res += count() * 40; color = get(a, b); run = 1; }
          }

          if (color) { push(run); run = 0; } run += size; push(run); res += count() * 40;

      }
      runs(function (a, b) { return M[a][b]; });
      runs(function (a, b) { return M[b][a]; });
      for (var y = 0; y < size - 1; y++) for (var x = 0; x < size - 1; x++) { var c = M[y][x]; if (c == M[y][x+1] && c == M[y+1][x] && c == M[y+1][x+1]) res += 3; }

      var total = size * size, k = Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1;

    }
    var best = 0, bestP = Infinity;
    for (var m = 0; m < 8; m++) { applyMask(m); drawFormat(m); var p = penalty(); if (p < bestP) { bestP = p; best = m; } applyMask(m); }
    applyMask(best); drawFormat(best);
    return { size: size, get: function (x, y) { return M[y][x]; } };
  }

  function toCanvas(text, canvas, opts) {
    opts = opts || {};
    var q = encode(text, opts.ecl || "M"), border = opts.border == null ? 4 : opts.border;
    var px = opts.size || 720, n = q.size + border * 2, scale = Math.max(1, Math.floor(px / n));

<script>
(function(){
  "use strict";
  var D={};try{D=JSON.parse(document.getElementById("jx-data").textContent)}catch(e){}
  var $=function(id){return document.getElementById(id)};
  var fa=function(n,d){return Number(n).toLocaleString("fa-IR",{maximumFractionDigits:d==null?2:d})};
  function size(b){b=+b||0;if(b>=1099511627776)return fa(b/1099511627776,2)+" TB";if(b>=1073741824)return fa(b/1073741824,2)+" GB";if(b>=1048576)return fa(b/1048576,1)+" MB";return fa(b/1024,0)+" KB"}
  var toastT;function toast(t){var el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove("show")},1700)}
  function copy(text,btn){
    text=String(text||"").trim();if(!text){toast("چیزی برای کپی نیست");return}
    function ok(){toast("کپی شد ✓");if(btn){btn.classList.add("done");setTimeout(function(){btn.classList.remove("done")},900)}}
    function fallback(){var ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;top:0;left:-9999px;opacity:0";document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,text.length);var r=false;try{r=document.execCommand("copy")}catch(e){}ta.remove();r?ok():toast("کپی نشد، دستی کپی کن")}
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(ok,fallback)}else fallback();
  }

  // ---- usage ----
  var used=+D.used||0,limit=+D.limit||0,exp=+D.expire||0,now=Date.now()/1000,unl=!limit;
  $("uname").textContent=D.username||"—";
  $("total").textContent=unl?"نامحدود":size(limit);
  $("used").textContent=size(used);
  $("remain").textContent=unl?"نامحدود":size(Math.max(limit-used,0));
  var pct=unl?0:Math.min(100,Math.round(used/limit*100));
  $("pct").textContent=unl?"∞":fa(pct,0)+"٪";
  requestAnimationFrame(function(){$("arc").style.strokeDashoffset=314.16*(1-(unl?1:pct/100))});
  var days=null;
  if(exp){days=Math.max(0,Math.ceil((exp-now)/86400));$("days").textContent=fa(days,0)+" روز";
    try{$("exp").textContent=new Date(exp*1000).toLocaleDateString("fa-IR",{year:"numeric",month:"long",day:"numeric"})}catch(e){$("exp").textContent=new Date(exp*1000).toISOString().slice(0,10)}
    $("daysline").textContent=fa(days,0)+" روز تا پایان اشتراک";
  }else{$("days").textContent="نامحدود";$("exp").textContent="بدون انقضا";$("daysline").textContent="بدون محدودیت زمانی"}
  var ST={active:["فعال","ok"],on_hold:["در انتظار اولین اتصال","hold"],limited:["حجم تمام شده","bad"],expired:["منقضی شده","bad"],disabled:["غیرفعال","bad"]};
  var st=ST[D.status]||[D.status||"نامشخص","warn"];var pill=$("pill");pill.textContent=st[0];pill.className="pill "+st[1];
  var w=$("warn");
  if(st[1]==="bad"){w.textContent="اشتراک شما "+st[0]+". برای تمدید به پشتیبانی پیام بدید.";w.className="alert bad"}
  else if(days!==null&&days<=3){w.textContent="فقط "+fa(days,0)+" روز تا پایان اشتراک مونده";w.className="alert warn"}
  else if(!unl&&pct>=85){w.textContent=fa(pct,0)+"٪ از حجم مصرف شده";w.className="alert warn"}
  if(D.announce){$("announce").textContent=D.announce;$("announce").classList.remove("hidden")}

  // ---- sub url + apps ----
  var sub=location.origin+location.pathname.replace(/\/+$/,"").replace(/\/(info|usage|links|links_base64|xray|clash|clash_meta|sing_box|sing-box|outline|wireguard)$/,"");
  $("suburl").textContent=sub;
  var name=encodeURIComponent("Super JinX");
  var APPS=[
    ["V2Box","v2box://install-sub?url="+encodeURIComponent(sub)+"&name="+name,"📦"],
    ["v2rayNG","v2rayng://install-config?url="+encodeURIComponent(sub)+"#"+name,"🤖"],
    ["Hiddify","hiddify://import/"+sub+"#"+name,"🛡"],
    ["Streisand","streisand://import/"+sub+"#"+name,"🍏"],
    ["Happ","happ://add/"+sub,"✨"],
    ["NekoBox","sn://subscription?url="+encodeURIComponent(sub)+"&name="+name,"🐱"]
  ];
  $("apps").innerHTML=APPS.map(function(a){return '<a class="app" href="'+a[1].replace(/"/g,"&quot;")+'"><i>'+a[2]+"</i>"+a[0]+"</a>"}).join("");

  // ---- configs ----
  function parse(link){
    var m=/^([a-z0-9+.-]+):\/\//i.exec(link)||[,"config"],proto=m[1].toUpperCase(),title="";
    var h=link.indexOf("#");if(h>-1){try{title=decodeURIComponent(link.slice(h+1).replace(/\+/g," "))}catch(e){title=link.slice(h+1)}}
    if(proto==="VMESS"&&!title){try{title=JSON.parse(atob(link.slice(8))).ps||""}catch(e){}}
    var net=(/[?&]type=([^&#]+)/.exec(link)||[])[1]||"";
    return {proto:proto,title:title||proto,net:net.toUpperCase()};
  }
  var links=(D.links||[]).filter(function(l){return l&&/^[a-z0-9+.-]+:\/\//i.test(l)});
  $("cfgtitle").textContent="کانفیگ‌ها ("+fa(links.length,0)+")";
  var COPY_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  var QR_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z"/></svg>';
  var box=$("cfgs");
  if(!links.length){box.innerHTML='<div class="row"><div class="body"><b>کانفیگی برای نمایش نیست</b><small>از لینک اشتراک در اپ استفاده کن</small></div></div>';$("copyall").classList.add("hidden")}
  links.forEach(function(l,i){
    var p=parse(l),row=document.createElement("div");row.className="row";
    row.innerHTML='<div class="ico">⚡</div><div class="body"><b></b><small></small></div><button class="btn" aria-label="QR">'+QR_SVG+'</button><button class="btn" aria-label="کپی">'+COPY_SVG+"</button>";
    row.querySelector("b").textContent=p.title;
    var tg=document.createElement("span");tg.className="tag";tg.textContent=p.proto+(p.net?" · "+p.net:"");row.querySelector("b").appendChild(tg);
    row.querySelector("small").textContent=l;
    var bs=row.querySelectorAll(".btn");
    bs[0].onclick=function(){openQr(l,p.title)};bs[1].onclick=function(){copy(l,bs[1])};
    box.appendChild(row);
  });
  $("copyall").onclick=function(){copy(links.join("\n"),null)};
  document.querySelector('[data-copy="sub"]').onclick=function(){copy(sub,this)};
  document.querySelector('[data-qr="sub"]').onclick=function(){openQr(sub,"لینک اشتراک")};

  // ---- QR (generated locally, works offline) ----
  var cur="";
  function openQr(text,title){
    cur=text;$("qrtitle").textContent=title;
    try{JinxQR.toCanvas(text,$("qrc"),{size:960,ecl:text.length>900?"L":"M",border:3})}catch(e){toast("QR ساخته نشد");return}
    $("modal").classList.add("show");$("modal").setAttribute("aria-hidden","false");
  }
  function closeQr(){$("modal").classList.remove("show");$("modal").setAttribute("aria-hidden","true")}
  $("qrclose").onclick=closeQr;
  $("modal").onclick=function(e){if(e.target===this)closeQr()};
  document.addEventListener("keydown",function(e){if(e.key==="Escape")closeQr()});
  $("qrcopy").onclick=function(){copy(cur,this)};
  $("qrsave").onclick=function(){
    var c=$("qrc");
    try{c.toBlob(function(b){var u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="SuperJinX-QR.png";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},3000);toast("عکس QR ذخیره شد")},"image/png")}
    catch(e){window.open(c.toDataURL("image/png"),"_blank")}
  };
})();
</script>
